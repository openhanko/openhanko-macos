<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The site favicon on Apple's app-icon canvas: a 824 px tile centred in
       1024, corner radius 22.4%. macOS does not mask icons, so a tile that
       filled the canvas would sit oversized beside every other Dock icon. -->
  <g transform="translate(100 100) scale(12.875)">
    <rect width="64" height="64" rx="14.3" fill="#16181b"/>
    <circle cx="32" cy="32" r="21" fill="none" stroke="#e34234" stroke-width="4"/>
    <text x="32" y="41" font-family="Hiragino Sans, sans-serif" font-size="24"
          fill="#e34234" text-anchor="middle">印</text>
  </g>
</svg>
